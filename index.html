<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>今日清单 · Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-labelledby="page-title">
        <div class="card-top">
          <div class="brand-mark" aria-hidden="true">✓</div>
          <button class="more-button" aria-label="更多选项">•••</button>
        </div>

        <header>
          <p class="eyebrow" id="current-date"></p>
          <h1 id="page-title">今天，要完成什么？</h1>
          <p class="subtitle">把注意力留给真正重要的事。</p>
        </header>

        <form class="add-form" id="add-form">
          <label class="sr-only" for="new-task">添加新任务</label>
          <input id="new-task" name="task" autocomplete="off" placeholder="添加一件待办事项…" maxlength="120" required />
          <button type="submit" aria-label="添加任务">+</button>
        </form>

        <nav class="filters" aria-label="任务筛选">
          <button class="filter active" data-filter="all">全部 <span id="all-count">0</span></button>
          <button class="filter" data-filter="active">待完成 <span id="active-count">0</span></button>
          <button class="filter" data-filter="done">已完成 <span id="done-count">0</span></button>
        </nav>

        <div class="task-area">
          <ul class="task-list" id="task-list" aria-live="polite"></ul>
          <div class="empty-state" id="empty-state" hidden>
            <div class="empty-icon">✦</div>
            <p>这里空空如也</p>
            <span>从添加一件小事开始吧</span>
          </div>
        </div>

        <footer>
          <span id="progress-text">0 项待完成</span>
          <button class="clear-button" id="clear-completed" type="button">清除已完成</button>
        </footer>
      </section>
    </main>
    <template id="task-template">
      <li class="task-item">
        <label class="check-wrap">
          <input class="task-toggle" type="checkbox" />
          <span class="custom-check" aria-hidden="true">✓</span>
        </label>
        <span class="task-label"></span>
        <button class="delete-button" type="button" aria-label="删除任务">×</button>
      </li>
    </template>
    <script src="app.js"></script>
  </body>
</html>
